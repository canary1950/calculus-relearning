<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微分積分 学び直しアプリ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fa;color:#222;line-height:1.75}
  .app{max-width:900px;margin:0 auto;padding:18px}
  .hero{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.08);margin-bottom:16px}
  h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px}
  .sub{color:#555;font-size:clamp(15px,2.7vw,18px)}
  .progress-wrap{margin-top:18px}
  .progress-label{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-bottom:6px}
  .progress{height:12px;background:#e7e9ee;border-radius:999px;overflow:hidden}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,#4b8cff,#6bc9a8);transition:.3s}
  .card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.07);margin-bottom:16px}
  h2{font-size:clamp(22px,4vw,30px);margin-top:0}
  h3{margin-bottom:8px}
  .concept{font-size:clamp(18px,3vw,23px);background:#f1f6ff;border-left:6px solid #4b8cff;padding:16px;border-radius:10px;margin:14px 0}
  .formula{font-family:Georgia,serif;font-size:clamp(24px,5vw,34px);text-align:center;padding:14px;background:#fafafa;border-radius:12px;margin:14px 0}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:17px}
  th,td{border:1px solid #dcdfe5;padding:10px;text-align:center}
  th{background:#f4f6f9}
  .quiz{background:#fff8e8;border-radius:14px;padding:18px;margin-top:20px}
  .quiz-title{font-weight:700;font-size:20px;margin-bottom:10px}
  .choices{display:grid;gap:10px}
  button{font:inherit;border:0;border-radius:12px;padding:14px 18px;cursor:pointer}
  .choice{background:white;border:2px solid #dfe3ea;text-align:left;font-size:18px}
  .choice:hover{background:#f7f9fc}
  .choice.correct{border-color:#2ca56d;background:#eefaf4}
  .choice.wrong{border-color:#d34b4b;background:#fff1f1}
  .feedback{margin-top:12px;font-weight:700;min-height:28px}
  .nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
  .nav button{background:#26364a;color:white;min-width:140px}
  .nav button.secondary{background:#e9edf2;color:#26364a}
  .nav button:disabled{opacity:.4;cursor:not-allowed}
  .step-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .step-pill{padding:12px;border-radius:12px;background:#f2f4f7;border:1px solid #e1e4e9;font-size:14px}
  .step-pill.active{background:#eaf3ff;border-color:#4b8cff;font-weight:700}
  .small{font-size:14px;color:#666}
  .example{background:#f8fafc;padding:14px;border-radius:12px}
  .finish{font-size:20px;background:#eefaf4;border-radius:12px;padding:16px}
  @media(max-width:600px){.card,.hero{padding:18px}.nav button{flex:1}.choice{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>微分積分 学び直し</h1>
    <div class="sub">数十年ぶりでも大丈夫。中学数学の感覚から、微分・積分まで一歩ずつ進みます。</div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="progressText">ステップ 1 / 10</span><span id="percentText">10%</span></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
  </section>

  <section class="card">
    <h3>全体の道のり</h3>
    <div class="step-list" id="stepList"></div>
  </section>

  <section class="card" id="lessonCard"></section>

  <section class="card nav">
    <button class="secondary" id="prevBtn" onclick="prevStep()">← 前へ</button>
    <button id="nextBtn" onclick="nextStep()">次へ →</button>
  </section>
</div>

<script>
const lessons = [
{
 title:'1. 「変化」を数学で考える',
 intro:'微分積分の出発点は、難しい記号ではなく「どのくらい変わるのか」を見ることです。',
 body:`
 <div class="concept">ある量が変わったとき、別の量がどれくらい変わるかを見る。</div>
 <p>たとえば、車が一定の速さで走るとします。</p>
 <table><tr><th>時間 x</th><th>距離 y</th></tr><tr><td>0時間</td><td>0km</td></tr><tr><td>1時間</td><td>50km</td></tr><tr><td>2時間</td><td>100km</td></tr><tr><td>3時間</td><td>150km</td></tr></table>
 <div class="formula">y = 50x</div>
 <p>これは「距離 ＝ 50 × 時間」という意味です。時間が1増えると、距離が50増えます。</p>
 <div class="example"><b>大事な感覚：</b> 微分とは、まず「変化の速さ」を調べる考え方です。</div>`,
 q:'y = 4x のとき、x = 3 なら y は？', choices:['7','12','16'], answer:1, explain:'4 × 3 = 12 です。'
},
{
 title:'2. 関数とは何か',
 intro:'関数は「数を入れると、決まったルールで答えが出る仕組み」です。',
 body:`
 <div class="concept">xを入れる → ルールに従う → yが出る</div>
 <p>たとえば <b>y = 2x + 1</b> なら、xに3を入れると、</p>
 <div class="formula">y = 2 × 3 + 1 = 7</div>
 <p>この「入力と出力」の関係を関数と呼びます。</p>
 <p class="small">英語では function といいます。</p>`,
 q:'y = 2x + 1 で x = 4 のとき、y は？', choices:['6','8','9'], answer:2, explain:'2×4+1=9 です。'
},
{
 title:'3. グラフと傾き',
 intro:'式を絵にすると、変化が目で見えるようになります。',
 body:`
 <p>y = 2x は右上がりの直線になります。</p>
 <div class="concept">傾き ＝ xが1増えたとき、yがどれだけ増えるか。</div>
 <p>y = 2x なら、xが1増えるたびにyは2増えます。だから傾きは2です。</p>
 <div class="formula">傾き = 2</div>`,
 q:'y = 5x の直線の傾きは？', choices:['1','5','x'], answer:1, explain:'xが1増えるとyが5増えるので、傾きは5です。'
},
{
 title:'4. 平均の変化の速さ',
 intro:'まずは、ある区間全体でどのくらい変わったかを考えます。',
 body:`
 <p>2時間で100km進んだなら、平均の速さは</p>
 <div class="formula">100 ÷ 2 = 50 km/h</div>
 <div class="concept">平均の変化の速さ ＝ yの変化量 ÷ xの変化量</div>
 <p>この考え方が、微分へつながります。</p>`,
 q:'3時間で180km進みました。平均の速さは？', choices:['60km/h','90km/h','540km/h'], answer:0, explain:'180÷3=60km/h です。'
},
{
 title:'5. 微分の入口',
 intro:'平均ではなく「その瞬間」を知りたいとき、微分が登場します。',
 body:`
 <p>車の速度は、ずっと同じとは限りません。では「ちょうど2秒後の速度」はどう求めるのでしょうか。</p>
 <div class="concept">非常に短い時間の変化を調べると、「瞬間の変化の速さ」に近づく。</div>
 <p>曲線のグラフでは、その瞬間の変化の速さは、その点での<b>接線の傾き</b>として表されます。</p>`,
 q:'微分で主に調べるものは？', choices:['瞬間の変化の速さ','図形の色','数の名前'], answer:0, explain:'微分の中心は「瞬間の変化の速さ」です。'
},
{
 title:'6. x²を微分してみる',
 intro:'ここで初めて、実際の微分計算を見ます。',
 body:`
 <p>代表的な関数</p><div class="formula">y = x²</div>
 <p>を微分すると、</p><div class="formula">y′ = 2x</div>
 <p>となります。つまり、xの値によって傾きが変化します。</p>
 <p>x=1なら傾き2、x=3なら傾き6です。</p>`,
 q:'y = x² の微分 y′ = 2x で、x=4のとき傾きは？', choices:['4','8','16'], answer:1, explain:'2×4=8です。'
},
{
 title:'7. 微分で最大・最小を探す',
 intro:'坂を登りきった頂上では、傾きが一瞬0になります。',
 body:`
 <div class="concept">最大・最小の候補では、傾きが0になることが多い。</div>
 <p>微分によって傾きを調べると、グラフの山や谷を探せます。</p>
 <p>これが「最大利益」「最短距離」「最高点」などを考える基礎になります。</p>`,
 q:'山の頂上での接線の傾きは一般に？', choices:['0','必ず100','無限大'], answer:0, explain:'頂上では一瞬水平になるので、傾きは0です。'
},
{
 title:'8. 積分の入口',
 intro:'積分は「小さなものをたくさん足し合わせる」考え方です。',
 body:`
 <p>たとえば、1秒ごとに進んだ距離を細かく足していけば、全体の距離が求められます。</p>
 <div class="concept">積分 ＝ 小さな量を集めて、全体を求める。</div>
 <p>微分が「細かく見る」なら、積分は「細かいものを集める」と考えるとよいでしょう。</p>`,
 q:'積分の基本イメージに近いものは？', choices:['小さな量を足し合わせる','全部引く','数字を隠す'], answer:0, explain:'積分は細かい量を積み重ねて全体を求めます。'
},
{
 title:'9. 面積と積分',
 intro:'曲線の下の面積も、小さな長方形を足し合わせれば近づけます。',
 body:`
 <p>曲線の下を細長い長方形に分け、それぞれの面積を足します。</p>
 <div class="concept">長方形を細くするほど、本当の面積に近づく。</div>
 <div class="formula">面積 ≈ 小さな面積の合計</div>
 <p>これを極限まで細かくした考えが定積分です。</p>`,
 q:'曲線の下の面積を求める考え方として正しいのは？', choices:['小さな面積を足す','角度だけ測る','数字を丸めるだけ'], answer:0, explain:'細い長方形の面積を足していくのが出発点です。'
},
{
 title:'10. 微分と積分は表裏一体',
 intro:'最後に最も大切な関係です。',
 body:`
 <p>微分は変化の速さを取り出し、積分は小さな変化を集めて全体を戻します。</p>
 <div class="concept">微分と積分は、おおまかに言えば逆向きの操作です。</div>
 <p>この関係を<b>微積分学の基本定理</b>と呼びます。</p>
 <div class="finish">ここまで理解できれば、微分積分の「意味」の土台は完成です。次は計算練習を少しずつ増やしていけば大丈夫です。</div>`,
 q:'微分と積分の関係として最も近いものは？', choices:['互いに深く関係し、逆向きの操作と考えられる','完全に無関係','どちらも足し算だけ'], answer:0, explain:'微分と積分は互いに逆向きの関係を持っています。'
}
];

let current=0;
let solved = Array(lessons.length).fill(false);

function renderStepList(){
 const box=document.getElementById('stepList');
 box.innerHTML='';
 lessons.forEach((l,i)=>{
  const d=document.createElement('div');
  d.className='step-pill'+(i===current?' active':'');
  d.textContent=`${i+1}. ${l.title.replace(/^\d+\.\s*/, '')}${solved[i]?' ✓':''}`;
  box.appendChild(d);
 });
}

function render(){
 const l=lessons[current];
 document.getElementById('lessonCard').innerHTML=`
  <h2>${l.title}</h2>
  <p>${l.intro}</p>
  ${l.body}
  <div class="quiz">
   <div class="quiz-title">ミニ問題</div>
   <p>${l.q}</p>
   <div class="choices" id="choices"></div>
   <div class="feedback" id="feedback"></div>
  </div>`;
 const ch=document.getElementById('choices');
 l.choices.forEach((c,i)=>{
   const b=document.createElement('button');
   b.className='choice'; b.textContent=c;
   b.onclick=()=>answer(i,b);
   ch.appendChild(b);
 });
 const pct=Math.round(((current+1)/lessons.length)*100);
 document.getElementById('bar').style.width=pct+'%';
 document.getElementById('progressText').textContent=`ステップ ${current+1} / ${lessons.length}`;
 document.getElementById('percentText').textContent=pct+'%';
 document.getElementById('prevBtn').disabled=current===0;
 document.getElementById('nextBtn').textContent=current===lessons.length-1?'最初に戻る ↺':'次へ →';
 renderStepList();
 window.scrollTo({top:0,behavior:'smooth'});
}

function answer(i,btn){
 const l=lessons[current];
 const buttons=[...document.querySelectorAll('.choice')];
 buttons.forEach(x=>x.disabled=true);
 if(i===l.answer){
   btn.classList.add('correct');
   document.getElementById('feedback').textContent='正解です！ '+l.explain;
   solved[current]=true;
 }else{
   btn.classList.add('wrong');
   buttons[l.answer].classList.add('correct');
   document.getElementById('feedback').textContent='もう一度確認しましょう。 '+l.explain;
 }
 renderStepList();
}
function nextStep(){ current=(current===lessons.length-1)?0:current+1; render(); }
function prevStep(){ if(current>0){current--;render();} }
render();
</script>
</body>
</html>
