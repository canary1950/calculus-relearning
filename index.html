<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微分積分 学び直しアプリ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fa;color:#222;line-height:1.75}.app{max-width:920px;margin:0 auto;padding:18px}.hero,.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.07);margin-bottom:16px}h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px}.sub{color:#555;font-size:clamp(15px,2.7vw,18px)}.stage-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stage-tab{background:#e9edf2;color:#26364a;font-weight:700}.stage-tab.active{background:#26364a;color:#fff}.progress-wrap{margin-top:18px}.progress-label{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-bottom:6px}.progress{height:12px;background:#e7e9ee;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#4b8cff,#6bc9a8);transition:.3s}.step-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.step-pill{padding:12px;border-radius:12px;background:#f2f4f7;border:1px solid #e1e4e9;font-size:14px;cursor:pointer}.step-pill.active{background:#eaf3ff;border-color:#4b8cff;font-weight:700}.step-pill.done{border-color:#69b58b;background:#f0fbf5}.concept{font-size:clamp(18px,3vw,23px);background:#f1f6ff;border-left:6px solid #4b8cff;padding:16px;border-radius:10px;margin:14px 0}.formula{font-family:Georgia,serif;font-size:clamp(24px,5vw,34px);text-align:center;padding:14px;background:#fafafa;border-radius:12px;margin:14px 0}.example{background:#f8fafc;padding:14px;border-radius:12px}.graphbox{margin:18px 0;padding:16px;border:1px solid #dfe5ed;border-radius:14px;background:#fbfdff}.graphbox h4{margin:0 0 8px;font-size:18px}.graph-note{font-size:15px;color:#555;margin-top:8px}.graphbox canvas{display:block;width:100%;height:320px;border-radius:10px;background:#fff}.quiz{background:#fff8e8;border-radius:14px;padding:18px;margin-top:20px}.quiz-title{font-weight:700;font-size:20px;margin-bottom:10px}.choices{display:grid;gap:10px}.choice{background:#fff;border:2px solid #dfe3ea;text-align:left;font-size:18px}.choice.correct{border-color:#2ca56d;background:#eefaf4}.choice.wrong{border-color:#d34b4b;background:#fff1f1}.feedback{margin-top:12px;font-weight:700;min-height:28px}.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}button{font:inherit;border:0;border-radius:12px;padding:14px 18px;cursor:pointer}.nav button{background:#26364a;color:#fff;min-width:140px}.nav button.secondary{background:#e9edf2;color:#26364a}.nav button:disabled{opacity:.4;cursor:not-allowed}.small{font-size:14px;color:#666}.finish{font-size:19px;background:#eefaf4;border-radius:12px;padding:16px}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:17px}th,td{border:1px solid #dcdfe5;padding:10px;text-align:center}th{background:#f4f6f9}@media(max-width:600px){.card,.hero{padding:18px}.nav button{flex:1}.choice{font-size:17px}.graphbox canvas{height:260px}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<h1>微分積分 学び直し</h1>
<div class="sub">数十年ぶりでも大丈夫。式・計算・グラフを同じ画面で結びつけて学びます。</div>
<div class="stage-tabs"><button class="stage-tab" id="tab0" onclick="switchStage(0)">第1段階：意味をつかむ</button><button class="stage-tab" id="tab1" onclick="switchStage(1)">第2段階：計算の基礎</button><button class="stage-tab" id="tab2" onclick="switchStage(2)">第3段階：使ってみる</button><button class="stage-tab" id="tab3" onclick="switchStage(3)">第4段階：現実の変化を読む</button></div>
<div class="progress-wrap"><div class="progress-label"><span id="progressText"></span><span id="percentText"></span></div><div class="progress"><div class="bar" id="bar"></div></div></div>
</section>
<section class="card"><h3>この段階の道のり</h3><div class="step-list" id="stepList"></div></section>
<section class="card" id="lessonCard"></section>
<section class="card nav"><button class="secondary" id="prevBtn" onclick="prevStep()">← 前へ</button><button id="nextBtn" onclick="nextStep()">次へ →</button></section>
</div>
<script>
const stages=[
{title:'第1段階：意味をつかむ',lessons:[
{title:'1. 「変化」を数学で考える',intro:'微分積分の出発点は「どのくらい変わるか」です。',body:`<div class="concept">ある量が変わったとき、別の量がどれくらい変わるかを見る。</div><p>車が一定の速さで走るとします。</p><table><tr><th>時間 x</th><th>距離 y</th></tr><tr><td>1</td><td>50</td></tr><tr><td>2</td><td>100</td></tr><tr><td>3</td><td>150</td></tr></table><div class="formula">y=50x</div><p>時間が1増えると距離が50増えます。</p>`,q:'y=4x のとき、x=3なら y は？',choices:['7','12','16'],correct:'12',explain:'4×3=12です。'},
{title:'2. 関数とは何か',intro:'関数は「入力すると、決まったルールで答えが出る仕組み」です。',body:`<div class="concept">xを入れる → ルールに従う → yが出る</div><div class="formula">y=2x+1</div><p>x=3なら y=7 です。</p>`,q:'y=2x+1 で x=4 のとき y は？',choices:['6','8','9'],correct:'9',explain:'2×4+1=9です。'},
{title:'3. グラフと傾き',intro:'式を絵にすると、変化が見えるようになります。',body:`<div class="concept">傾き＝xが1増えたとき、yがどれだけ増えるか。</div><div class="formula">y=5x → 傾きは5</div>`,graph:{type:'line',m:5,b:0,xMin:-1,xMax:5,yMin:-5,yMax:25,label:'y = 5x',showRiseRun:true,rx:1},q:'y=5x の直線の傾きは？',choices:['1','5','x'],correct:'5',explain:'グラフでも、xが1増えるとyが5増えます。'},
{title:'4. 平均の変化の速さ',intro:'まず区間全体でどのくらい変わったかを見ます。',body:`<div class="formula">平均の変化の速さ＝yの変化量÷xの変化量</div><p>3時間で180km進むなら平均60km/hです。</p>`,graph:{type:'line',m:60,b:0,xMin:0,xMax:3.5,yMin:0,yMax:210,label:'距離 y = 60x',showRiseRun:true,rx:1},q:'3時間で180km進みました。平均の速さは？',choices:['60km/h','90km/h','540km/h'],correct:'60km/h',explain:'180÷3=60km/hです。グラフの傾きも60です。'},
{title:'5. 微分の入口',intro:'「その瞬間」を知りたいとき、微分が登場します。',body:`<div class="concept">ごく短い区間の平均の傾きを調べると、瞬間の傾きに近づく。</div><p>曲線では、その点に触れる接線の傾きが「その瞬間の変化の速さ」です。</p>`,graph:{type:'tangent',x0:2,xMin:-1,xMax:4,yMin:-2,yMax:16,label:'y = x² と x=2 の接線'},q:'微分で主に調べるものは？',choices:['瞬間の変化の速さ','図形の色','数の名前'],correct:'瞬間の変化の速さ',explain:'曲線上の一点での接線の傾きとして見ることができます。'},
{title:'6. x²を微分してみる',intro:'最も代表的な微分を、式とグラフを対応させて見ます。',body:`<div class="formula">y=x² → y′=2x</div><p>x=4なら傾きは8です。</p>`,graph:{type:'tangent',x0:4,xMin:-1,xMax:6,yMin:-5,yMax:36,label:'y = x²、x=4 で傾き8'},q:'y′=2x で x=4 のとき傾きは？',choices:['4','8','16'],correct:'8',explain:'2×4=8です。接線がかなり急になっていることもグラフで確認できます。'},
{title:'7. 最大・最小と微分',intro:'山の頂上では傾きが一瞬0になります。',body:`<div class="concept">最大・最小の候補では傾きが0になることが多い。</div><p>頂上では接線が水平になります。</p>`,graph:{type:'mountain',xMin:-3,xMax:3,yMin:-2,yMax:6,label:'山の頂上では接線が水平'},q:'山の頂上での接線の傾きは一般に？',choices:['0','100','無限大'],correct:'0',explain:'頂上では接線が水平なので傾きは0です。'},
{title:'8. 積分の入口',intro:'積分は「小さなものを足し合わせる」考え方です。',body:`<div class="concept">積分＝小さな量を集めて全体を求める。</div>`,q:'積分の基本イメージに近いものは？',choices:['小さな量を足し合わせる','全部引く','数字を隠す'],correct:'小さな量を足し合わせる',explain:'細かい量を積み重ねて全体を求めます。'},
{title:'9. 面積と積分',intro:'曲線の下の面積も、小さな面積を足せば求められます。',body:`<div class="concept">長方形を細くするほど、本当の面積に近づく。</div><div class="formula">面積≈小さな面積の合計</div>`,q:'曲線の下の面積を求める考え方は？',choices:['小さな面積を足す','角度だけ測る','丸めるだけ'],correct:'小さな面積を足す',explain:'細い長方形の面積を足すのが出発点です。'},
{title:'10. 微分と積分は表裏一体',intro:'最後に最も大切な関係です。',body:`<div class="concept">微分は変化を取り出し、積分は小さな変化を集めて全体を戻す。</div><div class="finish">第1段階終了。次は「なぜその計算になるのか」をグラフと一緒に確かめながら基本計算へ進みます。</div>`,q:'微分と積分の関係として近いものは？',choices:['おおまかに逆向きの操作','全く無関係','同じ記号'],correct:'おおまかに逆向きの操作',explain:'微積分学の基本定理につながる重要な関係です。'}]},
{title:'第2段階：計算の基礎',lessons:[
{title:'1. 文字式を思い出す',intro:'微分の前に、xを使った式の扱いを少し復習します。',body:`<p>文字 x は「まだ決まっていない数」を表します。</p><div class="formula">3x = 3×x</div><p>x=4なら3x=12です。</p>`,q:'5x で x=2 のとき？',choices:['7','10','25'],correct:'10',explain:'5×2=10です。'},
{title:'2. x² と x³',intro:'指数の意味を思い出します。',body:`<div class="formula">x²=x×x　　x³=x×x×x</div><p>x=3なら x²=9、x³=27です。</p>`,q:'x=2 のとき x³ は？',choices:['4','6','8'],correct:'8',explain:'2×2×2=8です。'},
{title:'3. 変化量 Δ を知る',intro:'微分では「少しだけ変わった量」をよく使います。',body:`<div class="concept">Δx は「xの変化量」という意味。</div><p>xが2から5になったなら Δx=3 です。</p>`,q:'xが4から9になりました。Δxは？',choices:['5','9','13'],correct:'5',explain:'9−4=5です。'},
{title:'4. 平均の傾きを式で出す',intro:'2点の間の傾きを、計算とグラフで同時に見ます。',body:`<div class="formula">傾き=(y₂−y₁)/(x₂−x₁)</div><p>(1,3)と(5,11)なら、傾き=(11−3)/(5−1)=2です。</p>`,graph:{type:'twoPoints',p1:[1,3],p2:[5,11],xMin:0,xMax:6,yMin:0,yMax:13,label:'2点を結ぶ直線の傾き = 2'},q:'(1,3) と (5,11) の間の傾きは？',choices:['2','4','8'],correct:'2',explain:'(11−3)÷(5−1)=8÷4=2です。右へ4、上へ8なので、1あたり2上がります。'},
{title:'5. y=x² の平均の傾き',intro:'直線ではなく曲線で、2点を結ぶ線の傾きを見ます。',body:`<p>y=x² で x=1から2では、yは1から4へ変化します。</p><div class="formula">平均の傾き=(4−1)/(2−1)=3</div>`,graph:{type:'secant',a:1,b:2,xMin:-0.5,xMax:3,yMin:-1,yMax:9,label:'y=x² の2点を結ぶ割線：傾き3'},q:'y=x² で x=1から2の平均の傾きは？',choices:['2','3','4'],correct:'3',explain:'(4−1)÷(2−1)=3です。グラフでは2点を結ぶ直線の傾きです。'},
{title:'6. 区間を小さくする',intro:'微分の核心を、割線が接線へ近づく様子で見ます。',body:`<p>y=x² で x=2 付近を考えます。</p><div class="concept">もう一つの点をx=2へ近づけると、2点を結ぶ割線が接線へ近づく。</div><p>x=2での瞬間の傾きは4です。</p>`,graph:{type:'approach',x0:2,xMin:-0.5,xMax:4,yMin:-2,yMax:16,label:'割線 → 接線：傾きは4へ近づく'},q:'y=x² の x=2 における微分係数は？',choices:['2','4','8'],correct:'4',explain:'y′=2x なので x=2 では4です。'},
{title:'7. べき乗の微分公式',intro:'ここで基本公式を覚えます。',body:`<div class="formula">xⁿ → n xⁿ⁻¹</div><p>x³なら 3x²、x⁴なら 4x³ です。</p><div class="example">指数を前に出し、指数を1つ減らす。</div>`,q:'x⁵ を微分すると？',choices:['5x⁴','x⁴','4x⁵'],correct:'5x⁴',explain:'指数5を前に出し、5−1=4にします。'},
{title:'8. 定数の微分',intro:'変わらない数の変化率は0です。',body:`<div class="formula">7 → 0</div><p>7という数はxが変わっても変化しません。</p>`,q:'100 を x で微分すると？',choices:['100','1','0'],correct:'0',explain:'定数は変化しないので微分は0です。'},
{title:'9. 足し算の微分',intro:'項ごとに微分できます。',body:`<div class="formula">x²+3x+5 → 2x+3</div><p>x²→2x、3x→3、5→0 です。</p>`,q:'x³+2x を微分すると？',choices:['3x²+2','3x+2','x²+2'],correct:'3x²+2',explain:'x³→3x²、2x→2です。'},
{title:'10. 基本微分のまとめ',intro:'第2段階の仕上げです。',body:`<div class="concept">微分計算は、変化の速さを素早く求める道具。</div><div class="formula">f(x)=2x³−x²+4 → f′(x)=6x²−2x</div><div class="finish">第2段階終了。次は接線、最大・最小、そして積分の基本へ進みます。</div>`,q:'f(x)=x⁴+3x² を微分すると？',choices:['4x³+6x','4x³+3x','x³+6x'],correct:'4x³+6x',explain:'x⁴→4x³、3x²→6xです。'}]},
{title:'第3段階：使ってみる',lessons:[
{title:'1. 接線の式を作る',intro:'微分で傾きが分かれば、その点に接する直線を作れます。',body:`<p>y=x² の x=1 では、点は (1,1)、傾きは y′=2x より2です。</p><div class="formula">y−1=2(x−1) → y=2x−1</div>`,graph:{type:'tangent',x0:1,xMin:-2,xMax:4,yMin:-3,yMax:10,label:'y=x² と x=1 の接線 y=2x−1'},q:'y=x² の x=1 での接線の傾きは？',choices:['1','2','3'],correct:'2',explain:'y′=2x に x=1 を入れるので2です。'},
{title:'2. 別の点で接線を作る',intro:'同じ曲線でも場所が変わると接線の傾きも変わります。',body:`<p>y=x² の x=2 では点は (2,4)、傾きは4です。</p><div class="formula">y−4=4(x−2) → y=4x−4</div>`,graph:{type:'tangent',x0:2,xMin:-1,xMax:5,yMin:-5,yMax:20,label:'x=2 では接線の傾きは4'},q:'y=x² の x=2 での接線は？',choices:['y=2x','y=4x−4','y=x+2'],correct:'y=4x−4',explain:'点(2,4)を通り、傾き4の直線です。'},
{title:'3. 微分で最小値を探す',intro:'傾きが0になる場所を探すと、谷の位置が分かります。',body:`<div class="formula">y=x²−4x+3　→　y′=2x−4</div><p>y′=0 とすると x=2。そこが谷の底です。</p>`,graph:{type:'quadraticVertex',a:1,b:-4,c:3,xMin:-1,xMax:5,yMin:-2,yMax:8,label:'x=2 で接線が水平になり最小'},q:'y′=2x−4 が0になる x は？',choices:['1','2','4'],correct:'2',explain:'2x−4=0 → x=2です。'},
{title:'4. 増える・減るを微分で見る',intro:'微分の符号を見ると、グラフが上がっているか下がっているか分かります。',body:`<div class="concept">y′が負 → 下がる　／　y′が正 → 上がる</div><p>y=x²−4x+3 では x=2 より左で下がり、右で上がります。</p>`,graph:{type:'quadraticVertex',a:1,b:-4,c:3,xMin:-1,xMax:5,yMin:-2,yMax:8,label:'左では下降、x=2を境に右では上昇'},q:'y′が正のとき、グラフは一般に？',choices:['上がる','下がる','必ず水平'],correct:'上がる',explain:'微分が正なら、xが増えるにつれてyも増える方向です。'},
{title:'5. 最大値を探す',intro:'山型のグラフでも、微分が0になる位置が頂上の候補です。',body:`<div class="formula">y=−x²+6x　→　y′=−2x+6</div><p>y′=0 より x=3。ここで最大値をとります。</p>`,graph:{type:'quadraticVertex',a:-1,b:6,c:0,xMin:-1,xMax:7,yMin:-3,yMax:11,label:'x=3 が山の頂上'},q:'y=−x²+6x が最大になる x は？',choices:['2','3','6'],correct:'3',explain:'−2x+6=0 → x=3です。'},
{title:'6. 積分は微分の逆向き',intro:'ここから積分計算に入ります。まず「元の式を戻す」と考えます。',body:`<div class="concept">2x を微分するのではなく、2x になる前の式を探す。</div><div class="formula">∫ 2x dx = x² + C</div><p>x²を微分すると2xになるので、積分ではx²へ戻ります。Cは定数です。</p>`,graph:{type:'area',fn:'2x',a:0,b:2,xMin:0,xMax:3,yMin:0,yMax:5,label:'2x を0から2まで積み上げるイメージ'},q:'2x の不定積分は？',choices:['x²+C','2x²+C','x+C'],correct:'x²+C',explain:'x²を微分すると2xになります。'},
{title:'7. べき乗の積分公式',intro:'微分とは逆に、指数を1増やしてから割ります。',body:`<div class="formula">∫ xⁿ dx = xⁿ⁺¹/(n+1) + C</div><p>たとえば ∫x²dx=x³/3+C です。</p>`,graph:{type:'integralRect',fn:'x2',a:0,b:2,n:6,xMin:0,xMax:2.5,yMin:0,yMax:4.5,label:'x² の下を長方形で近似'},q:'∫ x² dx は？',choices:['x³/3+C','2x+C','x²/2+C'],correct:'x³/3+C',explain:'指数2を3にして、3で割ります。'},
{title:'8. 足し算を積分する',intro:'微分と同じように、項ごとに積分できます。',body:`<div class="formula">∫(2x+3)dx = x²+3x+C</div><p>2x→x²、3→3x です。</p>`,q:'∫(3x²+2)dx は？',choices:['x³+2x+C','3x³+2+C','x²+2x+C'],correct:'x³+2x+C',explain:'3x²→x³、2→2xです。'},
{title:'9. 定積分で面積を求める',intro:'積分区間を決めると、曲線の下の面積を数値で求められます。',body:`<p>y=x を 0から2まで積分します。</p><div class="formula">∫₀² x dx = [x²/2]₀² = 2</div>`,graph:{type:'integralRect',fn:'x',a:0,b:2,n:10,xMin:0,xMax:2.5,yMin:0,yMax:2.5,label:'長方形を細かくすると三角形の面積2に近づく'},q:'∫₀² x dx の値は？',choices:['1','2','4'],correct:'2',explain:'2²/2−0²/2=2です。'},
{title:'10. 微分と積分がつながる',intro:'最後に、第1段階で見た「表裏一体」を計算でも確認します。',body:`<p>x²を微分すると2x。反対に2xを積分するとx²へ戻ります。</p><div class="formula">∫₀² 2x dx = [x²]₀² = 4</div><div class="finish">第3段階終了。接線、最大・最小、基本的な積分、面積までつながりました。</div>`,graph:{type:'area',fn:'2x',a:0,b:2,xMin:0,xMax:2.5,yMin:0,yMax:4.5,label:'2x の下の面積は4。原始関数 x² の増加量とも一致'},q:'∫₀² 2x dx の値は？',choices:['2','4','8'],correct:'4',explain:'[x²]₀²=4−0=4です。'}]}
];
let stageIndex=Number(localStorage.getItem('calc_stage')||0);if(stageIndex>=stages.length)stageIndex=0;let stepIndex=Number(localStorage.getItem('calc_step_'+stageIndex)||0);let solved=JSON.parse(localStorage.getItem('calc_solved')||'{}');
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function key(){return stageIndex+'-'+stepIndex}
function switchStage(i){stageIndex=i;stepIndex=Number(localStorage.getItem('calc_step_'+stageIndex)||0);localStorage.setItem('calc_stage',stageIndex);render()}
function graphHTML(graph){if(!graph)return '';return `<div class="graphbox"><h4>グラフで確認</h4><canvas id="lessonGraph"></canvas><div class="graph-note">${graph.label||''}</div></div>`}
function render(){const stage=stages[stageIndex],lesson=stage.lessons[stepIndex]||stage.lessons[0];if(!stage.lessons[stepIndex])stepIndex=0;for(let i=0;i<stages.length;i++){const t=document.getElementById('tab'+i);if(t)t.classList.toggle('active',stageIndex===i)}const pct=Math.round(((stepIndex+1)/stage.lessons.length)*100);document.getElementById('progressText').textContent=`${stage.title}　${stepIndex+1} / ${stage.lessons.length}`;document.getElementById('percentText').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';const list=document.getElementById('stepList');list.innerHTML='';stage.lessons.forEach((l,i)=>{const d=document.createElement('div');d.className='step-pill'+(i===stepIndex?' active':'')+(solved[stageIndex+'-'+i]?' done':'');d.textContent=l.title;d.onclick=()=>{stepIndex=i;saveStep();render()};list.appendChild(d)});const opts=shuffle(lesson.choices.map(x=>({text:x,correct:x===lesson.correct})));document.getElementById('lessonCard').innerHTML=`<h2>${lesson.title}</h2><p>${lesson.intro}</p>${lesson.body}${graphHTML(lesson.graph)}<div class="quiz"><div class="quiz-title">確認問題</div><p>${lesson.q}</p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></div>`;const choices=document.getElementById('choices');opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.text;b.onclick=()=>answer(b,o.correct,lesson.explain);choices.appendChild(b)});if(lesson.graph)requestAnimationFrame(()=>drawGraph(lesson.graph));document.getElementById('prevBtn').disabled=(stageIndex===0&&stepIndex===0);const last=stepIndex===stage.lessons.length-1;document.getElementById('nextBtn').textContent=last?(stageIndex<stages.length-1?`第${stageIndex+2}段階へ →`:'最初に戻る ↺'):'次へ →';window.scrollTo({top:0,behavior:'smooth'})}
function drawGraph(g){const c=document.getElementById('lessonGraph');if(!c)return;const dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=rect.width*dpr;c.height=rect.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const W=rect.width,H=rect.height,pad=42;const xMin=g.xMin??-1,xMax=g.xMax??5,yMin=g.yMin??-2,yMax=g.yMax??20;const X=x=>pad+(x-xMin)/(xMax-xMin)*(W-2*pad),Y=y=>H-pad-(y-yMin)/(yMax-yMin)*(H-2*pad);ctx.clearRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle='#e6eaf0';for(let i=0;i<=6;i++){let x=xMin+(xMax-xMin)*i/6;ctx.beginPath();ctx.moveTo(X(x),pad);ctx.lineTo(X(x),H-pad);ctx.stroke()}for(let i=0;i<=6;i++){let y=yMin+(yMax-yMin)*i/6;ctx.beginPath();ctx.moveTo(pad,Y(y));ctx.lineTo(W-pad,Y(y));ctx.stroke()}ctx.strokeStyle='#7b8794';ctx.lineWidth=1.5;if(yMin<=0&&yMax>=0){ctx.beginPath();ctx.moveTo(pad,Y(0));ctx.lineTo(W-pad,Y(0));ctx.stroke()}if(xMin<=0&&xMax>=0){ctx.beginPath();ctx.moveTo(X(0),pad);ctx.lineTo(X(0),H-pad);ctx.stroke()}ctx.fillStyle='#5a6570';ctx.font='12px sans-serif';for(let i=0;i<=6;i++){let x=xMin+(xMax-xMin)*i/6;ctx.fillText(formatNum(x),X(x)-8,H-pad+18)}for(let i=0;i<=6;i++){let y=yMin+(yMax-yMin)*i/6;ctx.fillText(formatNum(y),5,Y(y)+4)}function plot(fn,stroke='#2f6fdd',width=3){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.beginPath();let started=false;for(let i=0;i<=500;i++){let x=xMin+(xMax-xMin)*i/500,y=fn(x);if(y<yMin-100||y>yMax+100)continue;let px=X(x),py=Y(y);if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}ctx.stroke()}function point(x,y,label){ctx.fillStyle='#d14b4b';ctx.beginPath();ctx.arc(X(x),Y(y),5,0,Math.PI*2);ctx.fill();if(label){ctx.fillStyle='#222';ctx.font='13px sans-serif';ctx.fillText(label,X(x)+8,Y(y)-8)}}function lineThrough(m,b,stroke='#e07a2f',width=2.5){plot(x=>m*x+b,stroke,width)}function fnFor(name){if(name==='x')return x=>x;if(name==='2x')return x=>2*x;if(name==='x2')return x=>x*x;return x=>x}if(g.type==='line'){lineThrough(g.m,g.b||0,'#2f6fdd',3);if(g.showRiseRun){let x1=g.rx||1,y1=g.m*x1+(g.b||0),x2=x1+1,y2=g.m*x2+(g.b||0);point(x1,y1);point(x2,y2);ctx.strokeStyle='#d14b4b';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#d14b4b';ctx.fillText('横に1',X((x1+x2)/2)-15,Y(y1)+18);ctx.fillText('上に'+formatNum(g.m),X(x2)+7,Y((y1+y2)/2))}}if(g.type==='twoPoints'){const [x1,y1]=g.p1,[x2,y2]=g.p2,m=(y2-y1)/(x2-x1),b=y1-m*x1;lineThrough(m,b,'#2f6fdd',3);point(x1,y1,`(${x1},${y1})`);point(x2,y2,`(${x2},${y2})`);ctx.strokeStyle='#d14b4b';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.stroke();ctx.setLineDash([])}if(g.type==='secant'||g.type==='approach'||g.type==='tangent'){plot(x=>x*x,'#2f6fdd',3)}if(g.type==='secant'){let a=g.a,b=g.b,ya=a*a,yb=b*b,m=(yb-ya)/(b-a),bb=ya-m*a;lineThrough(m,bb,'#e07a2f',2.5);point(a,ya,`A(${a},${ya})`);point(b,yb,`B(${b},${yb})`)}if(g.type==='tangent'){let x0=g.x0,y0=x0*x0,m=2*x0,b=y0-m*x0;lineThrough(m,b,'#e07a2f',2.5);point(x0,y0,`x=${x0}, 傾き=${m}`)}if(g.type==='approach'){let x0=g.x0,y0=x0*x0;[1,0.5,0.2].forEach((h,idx)=>{let x1=x0+h,y1=x1*x1,m=(y1-y0)/h,b=y0-m*x0;lineThrough(m,b,idx===2?'#e07a2f':'#a0a7af',idx===2?2.7:1.3)});let m=2*x0,b=y0-m*x0;lineThrough(m,b,'#d14b4b',2.2);point(x0,y0,'基準点 x=2')}if(g.type==='mountain'){plot(x=>5-x*x,'#2f6fdd',3);lineThrough(0,5,'#e07a2f',2.5);point(0,5,'頂上：傾き0')}if(g.type==='quadraticVertex'){const a=g.a,b=g.b,c0=g.c||0,fn=x=>a*x*x+b*x+c0;plot(fn,'#2f6fdd',3);const vx=-b/(2*a),vy=fn(vx);lineThrough(0,vy,'#e07a2f',2.5);point(vx,vy,`x=${formatNum(vx)}, 傾き0`)}if(g.type==='integralRect'||g.type==='area'){const fn=fnFor(g.fn),a=g.a,b=g.b;if(g.type==='integralRect'){const n=g.n||6,dx=(b-a)/n;ctx.fillStyle='rgba(77,141,255,.22)';ctx.strokeStyle='rgba(77,141,255,.65)';ctx.lineWidth=1;for(let i=0;i<n;i++){const x=a+i*dx,h=fn(x+dx/2);ctx.beginPath();ctx.rect(X(x),Y(h),X(x+dx)-X(x),Y(0)-Y(h));ctx.fill();ctx.stroke()}}else{ctx.fillStyle='rgba(77,141,255,.22)';ctx.beginPath();ctx.moveTo(X(a),Y(0));for(let i=0;i<=200;i++){const x=a+(b-a)*i/200;ctx.lineTo(X(x),Y(fn(x)))}ctx.lineTo(X(b),Y(0));ctx.closePath();ctx.fill()}plot(fn,'#2f6fdd',3);ctx.fillStyle='#222';ctx.font='14px sans-serif';ctx.fillText(`x=${a} から x=${b}`,X(a)+8,Y(0)-10)}}
function formatNum(n){return Math.abs(n)>=100?Math.round(n):Number(n.toFixed(1)).toString()}
function answer(btn,isCorrect,explain){const all=[...document.querySelectorAll('.choice')];if(all.some(x=>x.disabled))return;all.forEach(x=>x.disabled=true);if(isCorrect){btn.classList.add('correct');document.getElementById('feedback').textContent='正解です！ '+explain;solved[key()]=true;localStorage.setItem('calc_solved',JSON.stringify(solved))}else{btn.classList.add('wrong');const lesson=stages[stageIndex].lessons[stepIndex];const good=all.find(x=>x.textContent===lesson.correct);if(good)good.classList.add('correct');document.getElementById('feedback').textContent='もう一度確認しましょう。 '+explain}renderStepListOnly()}
function renderStepListOnly(){const stage=stages[stageIndex],list=document.getElementById('stepList');[...list.children].forEach((d,i)=>{d.classList.toggle('done',!!solved[stageIndex+'-'+i])})}
function saveStep(){localStorage.setItem('calc_step_'+stageIndex,stepIndex);localStorage.setItem('calc_stage',stageIndex)}
function nextStep(){const stage=stages[stageIndex];if(stepIndex<stage.lessons.length-1){stepIndex++}else if(stageIndex<stages.length-1){stageIndex++;stepIndex=0}else{stageIndex=0;stepIndex=0}saveStep();render()}
function prevStep(){if(stepIndex>0){stepIndex--}else if(stageIndex>0){stageIndex--;stepIndex=stages[stageIndex].lessons.length-1}saveStep();render()}
window.addEventListener('resize',()=>{const lesson=stages[stageIndex].lessons[stepIndex];if(lesson.graph)drawGraph(lesson.graph)});render();
</script>
</body>
</html>
